<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactor Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.0/Recharts.min.js"></script>
</head>

<body class="bg-gray-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        const ERR_TC_GAS_INTERNAL = (1 << 0);
        const ERR_TC_FEEDSTOCK = (1 << 1);
        const ERR_TC_VAPORIZER_WALL = (1 << 2);
        const ERR_TC_REACTOR_INT_1 = (1 << 3);
        const ERR_TC_REACTOR_INT_2 = (1 << 4);
        const ERR_TC_REACTOR_EXT_1 = (1 << 5);
        const ERR_TC_REACTOR_EXT_2 = (1 << 6);
        const ERR_P_FEED = (1 << 7);
        const ERR_P_REACTOR = (1 << 8); // Not used yet
        const ERR_MFC_FLOW = (1 << 9);
        const ERR_H2_SENSOR = (1 << 10);

        const STATE_LABELS = {
            0: "STANDBY",
            1: "WARMUP",
            2: "WORKING"
        };

        const STATE_COLORS = {
            0: "text-gray-400 border border-gray-600",
            1: "text-yellow-400 border border-yellow-600",
            2: "text-green-400 border border-green-600"
        };

        function App() {
            const [data, setData] = useState([]);
            const [latest, setLatest] = useState(null);
            const [status, setStatus] = useState("DISCONNECTED");
            const [timeRange, setTimeRange] = useState(0.5);
            const [runStatus, setRunStatus] = useState(null);
            const [sessionReady, setSessionReady] = useState(false);

            useEffect(() => {
                fetch('/api/run/status')
                    .then(r => r.json())
                    .then(s => setRunStatus(s))
                    .catch(e => console.error(e));
            }, []);

            useEffect(() => {
                if (!sessionReady) return;
                const fetchHistory = async () => {
                    try {
                        const res = await fetch(`/api/history?hours=${timeRange}`);
                        const hist = await res.json();
                        setData(hist);
                    } catch (e) {
                        console.error("Failed to fetch history", e);
                    }
                };
                fetchHistory();
            }, [timeRange, sessionReady]);

            useEffect(() => {
                if (!sessionReady) return;
                const ws = new WebSocket(`ws://${window.location.host}/ws`);

                ws.onopen = () => setStatus("CONNECTED");
                ws.onclose = () => setStatus("DISCONNECTED");

                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    
                    if (msg.event === "manual_override") {
                        // We received a manual override from the backend
                        // The backend already updated its own state, so the next telemetry will have pump.mode = 'manual'
                        // We can alert the user
                        console.warn("Physical manual override detected!");
                        return; // Don't process this as a telemetry packet
                    }
                    
                    // Add ts for graph
                    msg.ts = new Date().toLocaleTimeString();

                    setLatest(msg);
                    setData(prev => {
                        const next = [...prev, msg];
                        if (next.length > 400) next.shift(); // Max 400 points to keep history + live
                        return next;
                    });
                };

                return () => ws.close();
            }, [sessionReady]);

            const sendState = async (s) => {
                await fetch(`/api/control/state/${s}`, { method: 'POST' });
            }

            const sendSetpoint = async (zone, val, rate) => {
                await fetch(`/api/control/setpoint?zone=${zone}&value=${val}&rate=${rate || 0}`, { method: 'POST' });
            }

            if (!runStatus) return <div className="p-10 text-center text-gray-400">Loading Session State...</div>;
            
            if (!sessionReady) {
                return <RunManagerModal status={runStatus} onComplete={() => setSessionReady(true)} />;
            }

            if (!latest) return <div className="p-10 text-center text-gray-400 animate-pulse">Waiting for telemetry...</div>;

            const [showAlarmConfig, setShowAlarmConfig] = useState(false);
            const s = latest.sensors || {};
            const h = latest.heaters || {};
            const sp = latest.sp || {};
            const stateIdx = latest.state || 0;
            const errMask = s.status || 0;
            const alarms = latest.alarms || { active: [], silenced: false, silence_time_left: 0.0 };

            return (
                <div className="min-h-screen p-4 flex flex-col gap-4">
                    {/* Header */}
                    <header className="bg-gray-800 p-4 rounded-lg shadow-lg flex justify-between items-center border-b border-gray-700">
                        <h1 className="text-2xl font-bold tracking-tight text-blue-400">Reactor Controller</h1>
                        <div className="flex gap-4 items-center">
                            <button 
                                onClick={() => setShowAlarmConfig(true)}
                                className="p-2 rounded bg-gray-700 hover:bg-gray-600 text-gray-200 text-lg transition-all shadow"
                                title="Alarm Settings"
                            >
                                ⚙
                            </button>
                            <div className={`text-xl font-bold px-3 py-1 rounded bg-gray-900 ${STATE_COLORS[stateIdx]}`}>
                                {STATE_LABELS[stateIdx] || "UNKNOWN"}
                            </div>
                            <div className="text-sm text-gray-400 font-mono">uptime: {latest.uptime}s</div>
                        </div>
                    </header>

                    {/* Alarm Settings Modal */}
                    {showAlarmConfig && <AlarmConfigModal onClose={() => setShowAlarmConfig(false)} />}

                    {/* Controls */}
                    <div className="flex gap-2 justify-center">
                        <button onClick={() => sendState(0)} className={`px-6 py-2 rounded font-bold transition-all ${stateIdx === 0 ? 'bg-gray-600 ring-2 ring-white' : 'bg-gray-700 text-gray-400 hover:bg-gray-600'}`}>STANDBY</button>
                        <button onClick={() => sendState(1)} className={`px-6 py-2 rounded font-bold transition-all ${stateIdx === 1 ? 'bg-yellow-600 ring-2 ring-white' : 'bg-yellow-800 text-yellow-200 hover:bg-yellow-700'}`}>WARMUP</button>
                        <button onClick={() => sendState(2)} className={`px-6 py-2 rounded font-bold transition-all ${stateIdx === 2 ? 'bg-green-600 ring-2 ring-white' : 'bg-green-800 text-green-200 hover:bg-green-700'}`}>WORKING</button>
                    </div>

                    {/* Process Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {/* Feedstock Pump */}
                        <PumpCard pump={latest.pump} />

                        {/* Load Cell */}
                        <LoadCellCard weight={s.weight} 
                            onTare={() => fetch('/api/control/tare', { method: 'POST' })}
                            onCalibrate={(w) => fetch(`/api/control/calibrate?value=${w}`, { method: 'POST' })} />

                        {/* H2 Sensor */}
                        <SensorCard title="H2 Sensor" value={s.h2} unit="ppm" color="text-pink-400" border="border-pink-500" />
                    </div>

                    {/* Temperature Controls */}
                    <h2 className="text-xl font-bold text-gray-300 mt-4 mb-1">Thermal Control</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {/* Feedstock Reservoir */}
                        <SensorCard title="Feedstock Reservoir" value={s.t_feed_res} unit="°C" color="text-teal-400" border="border-teal-500" />

                        {/* Feedstock Preheater */}
                        <ZoneCard title="Feedstock Preheater"
                            temp={s.t_feed_pre} sp={sp.feed_pre} out={h.feed_pre}
                            onSetSp={(v, r) => sendSetpoint(0, v, r)} />

                        {/* Liquid Reactor */}
                        <ZoneCard title="Liquid Reactor"
                            temp={s.t_liq_reac} sp={sp.liq_reac} out={h.liq_reac}
                            onSetSp={(v, r) => sendSetpoint(1, v, r)} />

                        {/* Gas Reactor */}
                        <ZoneCard title="Gas Reactor"
                            temp={s.t_gas_reac_int * 0.7 + s.t_gas_reac_ext * 0.3}
                            sub={`Int: ${s.t_gas_reac_int}°C | Ext: ${s.t_gas_reac_ext}°C`}
                            sp={sp.gas_reac} out={h.gas_reac}
                            onSetSp={(v, r) => sendSetpoint(2, v, r)} />
                    </div>

                    {/* Chart */}
                    <div className="flex-1 bg-gray-800 p-4 rounded-lg min-h-[400px] border border-gray-700 shadow-inner flex flex-col">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-gray-300">Historical Data</h2>
                            <select className="bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 text-sm outline-none"
                                value={timeRange} onChange={(e) => setTimeRange(parseFloat(e.target.value))}>
                                <option value={0.5}>Last 30 Minutes</option>
                                <option value={1}>Last 1 Hour</option>
                                <option value={6}>Last 6 Hours</option>
                                <option value={24}>Last 24 Hours</option>
                                <option value={72}>Last 72 Hours</option>
                            </select>
                        </div>
                        <ResponsiveContainer width="100%" height={400}>
                            <LineChart data={data}>
                                <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                <XAxis dataKey="ts" stroke="#9CA3AF" />
                                <YAxis yAxisId="left" stroke="#9CA3AF" />
                                <YAxis yAxisId="right" orientation="right" stroke="#818CF8" />
                                <Tooltip contentStyle={{ backgroundColor: '#1F2937', border: '1px solid #4B5563', borderRadius: '0.5rem' }} />
                                <Legend />
                                <Line yAxisId="left" type="monotone" dataKey="sensors.weight" stroke="#14B8A6" dot={false} name="Weight (Kg)" />
                                <Line yAxisId="right" type="stepAfter" dataKey="pump.speed" stroke="#818CF8" dot={false} name="Pump Speed" />
                                <Line yAxisId="right" type="monotone" dataKey="sensors.t_feed_res" stroke="#2DD4BF" dot={false} name="Feed Res (°C)" />
                                <Line yAxisId="right" type="monotone" dataKey="sensors.t_feed_pre" stroke="#FBBF24" dot={false} name="Feed Pre (°C)" />
                                <Line yAxisId="right" type="monotone" dataKey="sensors.t_liq_reac" stroke="#EF4444" dot={false} name="Liq Reac (°C)" />
                                <Line yAxisId="right" type="monotone" dataKey="sensors.t_gas_reac_int" stroke="#A78BFA" dot={false} name="Gas Int (°C)" />
                                <Line yAxisId="right" type="monotone" dataKey="sensors.t_gas_reac_ext" stroke="#6366F1" dot={false} name="Gas Ext (°C)" />
                            </LineChart>
                        </ResponsiveContainer>
                    </div>

                    {/* Critical Alarm Modal */}
                    {alarms.active && alarms.active.length > 0 && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className={`bg-gray-900 border-2 rounded-xl p-6 max-w-lg w-full shadow-2xl flex flex-col gap-4 text-white transition-all ${alarms.silenced ? 'border-yellow-500' : 'border-red-500'}`}>
                                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                                    <div className="flex items-center gap-3">
                                        <span className="text-3xl animate-bounce">{alarms.silenced ? '🔕' : '🚨'}</span>
                                        <div>
                                            <h2 className={`text-xl font-bold uppercase tracking-wide ${alarms.silenced ? 'text-yellow-400' : 'text-red-500'}`}>
                                                {alarms.silenced ? `SILENCED (${alarms.silence_time_left}s remaining)` : 'CRITICAL ALARM ACTIVE'}
                                            </h2>
                                            <p className="text-xs text-gray-400 font-mono">
                                                {alarms.silenced ? 'BUZZER RELAY OPEN / MUTED' : 'BUZZER SOUNDING / RELAY CLOSED'}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-3 max-h-[250px] overflow-y-auto pr-1">
                                    {alarms.active.map((alarm, idx) => (
                                        <div key={idx} className="bg-red-950/40 border border-red-900/60 p-3 rounded-lg flex flex-col gap-1">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-red-400">{alarm.name}</span>
                                                <span className="text-xs font-mono bg-red-900/60 text-red-200 px-2 py-0.5 rounded font-bold">{alarm.code}</span>
                                            </div>
                                            <p className="text-sm text-gray-300">{alarm.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={async () => {
                                        if (!alarms.silenced) {
                                            await fetch('/api/control/alarm/silence', { method: 'POST' });
                                        }
                                    }} 
                                    disabled={alarms.silenced}
                                    className={`w-full py-3 font-bold text-lg rounded-lg shadow-lg transition-all ${
                                        alarms.silenced 
                                            ? 'bg-gray-700 text-gray-400 opacity-50 cursor-not-allowed border border-gray-600' 
                                            : 'bg-red-600 hover:bg-red-500 text-white active:scale-95'
                                    }`}
                                >
                                    {alarms.silenced ? `Silenced (${alarms.silence_time_left}s remaining)` : 'Silence Buzzer (5 Min)'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        function AlarmConfigModal({ onClose }) {
            const [cfg, setCfg] = useState({
                preheater: { low: 100, high: 180 },
                liquid: { low: 170, high: 220 },
                gas: { low: 180, high: 270 }
            });
            const [saving, setSaving] = useState(false);
            const [msg, setMsg] = useState("");

            useEffect(() => {
                fetch('/api/config/alarms')
                    .then(r => r.json())
                    .then(data => { if (data && data.preheater) setCfg(data); })
                    .catch(e => console.error("Error loading alarm config", e));
            }, []);

            const handleSave = async () => {
                setSaving(true);
                try {
                    await fetch('/api/config/alarms', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(cfg)
                    });
                    setMsg("Settings Saved Successfully!");
                    setTimeout(() => onClose(), 800);
                } catch (e) {
                    alert("Failed to save alarm settings");
                } finally {
                    setSaving(false);
                }
            };

            const updateField = (zone, type, val) => {
                const num = parseFloat(val) || 0;
                setCfg(prev => ({
                    ...prev,
                    [zone]: { ...prev[zone], [type]: num }
                }));
            };

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-gray-800 border border-gray-600 rounded-xl p-6 max-w-md w-full shadow-2xl flex flex-col gap-4 text-white">
                        <div className="flex justify-between items-center border-b border-gray-700 pb-3">
                            <h2 className="text-xl font-bold text-blue-400">⚙ Alarm Temperature Limits</h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
                        </div>

                        {msg && <div className="bg-green-900/60 border border-green-700 text-green-300 p-2 rounded text-center text-sm font-bold">{msg}</div>}

                        <div className="flex flex-col gap-4">
                            {/* Preheater */}
                            <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 flex flex-col gap-2">
                                <span className="font-bold text-teal-400">Feedstock Preheater</span>
                                <div className="grid grid-cols-2 gap-2 text-sm">
                                    <div>
                                        <label className="text-gray-400 block text-xs">Low Temp (°C)</label>
                                        <input type="number" className="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white outline-none focus:border-blue-500"
                                            value={cfg.preheater.low} onChange={e => updateField('preheater', 'low', e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-gray-400 block text-xs">High Temp (°C)</label>
                                        <input type="number" className="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white outline-none focus:border-blue-500"
                                            value={cfg.preheater.high} onChange={e => updateField('preheater', 'high', e.target.value)} />
                                    </div>
                                </div>
                            </div>

                            {/* Liquid Reactor */}
                            <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 flex flex-col gap-2">
                                <span className="font-bold text-red-400">Liquid Phase Reactor</span>
                                <div className="grid grid-cols-2 gap-2 text-sm">
                                    <div>
                                        <label className="text-gray-400 block text-xs">Low Temp (°C)</label>
                                        <input type="number" className="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white outline-none focus:border-blue-500"
                                            value={cfg.liquid.low} onChange={e => updateField('liquid', 'low', e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-gray-400 block text-xs">High Temp (°C)</label>
                                        <input type="number" className="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white outline-none focus:border-blue-500"
                                            value={cfg.liquid.high} onChange={e => updateField('liquid', 'high', e.target.value)} />
                                    </div>
                                </div>
                            </div>

                            {/* Gas Reactor */}
                            <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 flex flex-col gap-2">
                                <span className="font-bold text-purple-400">Gas Phase Reactor (Avg)</span>
                                <div className="grid grid-cols-2 gap-2 text-sm">
                                    <div>
                                        <label className="text-gray-400 block text-xs">Low Temp (°C)</label>
                                        <input type="number" className="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white outline-none focus:border-blue-500"
                                            value={cfg.gas.low} onChange={e => updateField('gas', 'low', e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-gray-400 block text-xs">High Temp (°C)</label>
                                        <input type="number" className="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white outline-none focus:border-blue-500"
                                            value={cfg.gas.high} onChange={e => updateField('gas', 'high', e.target.value)} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-2 justify-end mt-2">
                            <button onClick={onClose} className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded font-bold">Cancel</button>
                            <button onClick={handleSave} disabled={saving} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded font-bold disabled:opacity-50">
                                {saving ? "Saving..." : "Save Settings"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function RunManagerModal({ status, onComplete }) {
            const [step, setStep] = useState(status.has_data ? "DETECTED" : "NEW_NAME");
            const [runName, setRunName] = useState("");

            const handleResume = () => {
                onComplete();
            };

            const handleExportAndClear = () => {
                window.location.href = '/api/run/export';
                setTimeout(() => setStep("NEW_NAME"), 1500); // Give it a moment to trigger download
            };

            const handleClearOnly = () => {
                setStep("NEW_NAME");
            };

            const handleStartNew = async () => {
                if (!runName) return alert("Please enter a Run Name");
                await fetch(`/api/run/new?run_name=${encodeURIComponent(runName)}`, { method: 'POST' });
                onComplete();
            };

            if (step === "DETECTED") {
                return (
                    <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50">
                        <div className="bg-gray-800 p-8 rounded-xl border border-gray-600 max-w-md w-full shadow-2xl">
                            <h2 className="text-2xl font-bold mb-4 text-blue-400">Run Session Detected</h2>
                            <p className="text-gray-300 mb-6">There is data in the database from a previous run: <span className="font-bold text-white bg-gray-700 px-2 py-1 rounded">{status.current_run_name || 'Unnamed Run'}</span></p>
                            <div className="flex flex-col gap-3">
                                <button onClick={handleResume} className="bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-white shadow">Resume Run</button>
                                <div className="border-t border-gray-700 my-3"></div>
                                <p className="text-sm text-gray-400 mb-1">Start a New Run:</p>
                                <button onClick={handleExportAndClear} className="bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold text-white shadow">Export Data & Start New</button>
                                <button onClick={handleClearOnly} className="bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold text-white shadow">Discard Data & Start New</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === "NEW_NAME") {
                return (
                    <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50">
                        <div className="bg-gray-800 p-8 rounded-xl border border-gray-600 max-w-md w-full shadow-2xl">
                            <h2 className="text-2xl font-bold mb-4 text-blue-400">Start New Run</h2>
                            <p className="text-gray-300 mb-4">Please name this reactor session. This name will be used for the exported CSV file later.</p>
                            <input type="text" 
                                className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white mb-6 focus:border-blue-500 outline-none" 
                                value={runName} 
                                onChange={e => setRunName(e.target.value)} 
                                placeholder="e.g., Batch_001_H2_Test" 
                                autoFocus
                            />
                            <button onClick={handleStartNew} className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-white shadow">Start Recording</button>
                        </div>
                    </div>
                );
            }
            return null;
        }



        function FlowCard({ title, flow, sp, onSet, connected }) {
            const [val, setVal] = useState(sp);

            // Mask content if disconnected
            const isDisconnected = connected === false;

            return (
                <div className={`bg-gray-800 p-4 rounded-lg border border-purple-500 shadow shadow-purple-900/20 relative overflow-hidden transition-all ${isDisconnected ? 'grayscale opacity-50' : ''}`}>
                    {isDisconnected && (
                        <div className="absolute inset-0 flex items-center justify-center bg-gray-900/80 z-10 backdrop-blur-sm">
                            <span className="text-red-500 font-bold border border-red-500 px-2 py-1 rounded bg-red-900/20 animate-pulse">DISCONNECTED</span>
                        </div>
                    )}

                    <h3 className="text-lg font-semibold text-purple-300 mb-2">{title}</h3>
                    <div className="flex justify-between items-end mb-4">
                        <div>
                            <div className="text-4xl font-mono">{(flow || 0).toFixed(1)}</div>
                            <div className="text-sm text-gray-500">SCCM</div>
                        </div>
                        <div className="text-right">
                            <div className="text-sm text-gray-400">Setpoint</div>
                            <div className="text-xl font-mono text-purple-300">{(sp || 0).toFixed(0)}</div>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <input type="number"
                            className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-20 text-white focus:border-purple-500 outline-none"
                            value={val} onChange={(e) => setVal(e.target.value)} disabled={isDisconnected} />
                        <button
                            className="bg-purple-600 px-3 py-1 rounded hover:bg-purple-500 disabled:bg-gray-600"
                            onClick={() => onSet(val)} disabled={isDisconnected}>SET</button>
                    </div>
                </div>
            );
        }

        function SensorCard({ title, value, unit, color, border, connected }) {
            const isDisconnected = connected === false;

            return (
                <div className={`bg-gray-800 p-4 rounded-lg border ${border} shadow opacity-90 relative overflow-hidden ${isDisconnected ? 'grayscale opacity-50' : ''}`}>
                    {isDisconnected && (
                        <div className="absolute inset-0 flex items-center justify-center bg-gray-900/80 z-10 backdrop-blur-sm">
                            <span className="text-red-500 font-bold border border-red-500 px-2 py-1 rounded bg-red-900/20 animate-pulse">DISCONNECTED</span>
                        </div>
                    )}
                    <h3 className={`text-lg font-semibold mb-2 ${color}`}>{title}</h3>
                    <div>
                        <div className="text-4xl font-mono">{(value || 0).toFixed(2)}</div>
                        <div className="text-sm text-gray-500">{unit}</div>
                    </div>
                </div>
            );
        }

        function ZoneCard({ title, temp, sub, sp, out, onSetSp, connected }) {
            const [val, setVal] = useState(sp);
            const [rate, setRate] = useState(0);

            const isDisconnected = connected === false;

            return (
                <div className={`bg-gray-800 p-4 rounded-lg border border-gray-700 relative overflow-hidden ${isDisconnected ? 'grayscale opacity-50' : ''}`}>
                    {isDisconnected && (
                        <div className="absolute inset-0 flex items-center justify-center bg-gray-900/80 z-10 backdrop-blur-sm">
                            <span className="text-red-500 font-bold border border-red-500 px-2 py-1 rounded bg-red-900/20 animate-pulse">DISCONNECTED</span>
                        </div>
                    )}

                    <h3 className="text-lg font-semibold text-gray-300 mb-2">{title}</h3>
                    <div className="flex justify-between items-end mb-4">
                        <div>
                            <div className="text-4xl font-mono">{(temp || 0).toFixed(1)}&deg;C</div>
                            {sub && <div className="text-xs text-gray-400 font-mono mt-1">{sub}</div>}
                            <div className="text-sm text-gray-500 mt-1">Output: <span className={out > 0 ? "text-orange-400" : "text-gray-600"}>{(out / 10).toFixed(0)}%</span></div>
                        </div>
                        <div className="text-right">
                            <div className="text-sm text-gray-400">Setpoint</div>
                            <div className="text-xl font-mono text-blue-300">{(sp || 0).toFixed(0)}&deg;C</div>
                        </div>
                    </div>
                    <div className="flex gap-2 items-center">
                        <div className="flex flex-col">
                            <label className="text-[10px] text-gray-500 uppercase tracking-wider">Target</label>
                            <input type="number"
                                className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-20 text-white focus:border-blue-500 outline-none"
                                value={val} onChange={(e) => setVal(e.target.value)} disabled={isDisconnected} />
                        </div>
                        <div className="flex flex-col">
                            <label className="text-[10px] text-gray-500 uppercase tracking-wider">Rate/min</label>
                            <input type="number"
                                className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-16 text-white focus:border-blue-500 outline-none"
                                placeholder="Opt"
                                value={rate} onChange={(e) => setRate(e.target.value)} disabled={isDisconnected} />
                        </div>
                        <button
                            className="bg-blue-600 px-3 py-1 rounded hover:bg-blue-500 h-9 mt-4 text-sm font-bold uppercase tracking-wide disabled:bg-gray-600"
                            onClick={() => onSetSp(val, rate)} disabled={isDisconnected}>SET</button>
                    </div>
                </div>
            );
        }

        function LoadCellCard({ weight, onTare, onCalibrate }) {
            const [knownWeight, setKnownWeight] = useState("");

            return (
                <div className="bg-gray-800 p-4 rounded-lg border border-teal-500 shadow shadow-teal-900/20 relative overflow-hidden">
                    <h3 className="text-lg font-semibold text-teal-400 mb-2">Weight Scale</h3>
                    <div className="flex justify-between items-end mb-4">
                        <div>
                            <div className="text-4xl font-mono">{(weight || 0).toFixed(3)}</div>
                            <div className="text-sm text-gray-500">Kg</div>
                        </div>
                    </div>
                    <div className="flex flex-col gap-2">
                        <button
                            className="bg-teal-600 px-3 py-1 rounded hover:bg-teal-500 font-bold tracking-wider"
                            onClick={onTare}>TARE</button>
                        <div className="flex gap-2">
                            <input type="number" placeholder="Known (Kg)"
                                className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-full text-white focus:border-teal-500 outline-none text-sm"
                                value={knownWeight} onChange={(e) => setKnownWeight(e.target.value)} />
                            <button
                                className="bg-orange-600 px-3 py-1 rounded hover:bg-orange-500 text-sm font-bold"
                                onClick={() => {
                                    if(knownWeight && parseFloat(knownWeight) > 0) {
                                        onCalibrate(parseFloat(knownWeight));
                                        setKnownWeight("");
                                    } else {
                                        alert("Please enter a valid known weight in Kg.");
                                    }
                                }}>CALIBRATE</button>
                        </div>
                    </div>
                </div>
            );
        }

        function PumpCard({ pump }) {
            const [localMin, setLocalMin] = useState(0);
            const [localMax, setLocalMax] = useState(0);
            const [localSpeed, setLocalSpeed] = useState(0);
            const [localDir, setLocalDir] = useState(0);

            // Sync with telemetry if not being edited (simple approach)
            React.useEffect(() => {
                if(pump) {
                    setLocalMin(pump.auto_min);
                    setLocalMax(pump.auto_max);
                }
            }, [pump?.auto_min, pump?.auto_max]);

            const isAuto = pump?.mode === 'auto';
            const isDisconnected = pump?.connected === false;
            const errMsg = pump?.error || "TIMEOUT OR NO RESPONSE";

            return (
                <div className={`bg-gray-800 p-4 rounded-lg border border-indigo-500 shadow shadow-indigo-900/20 relative overflow-hidden flex flex-col justify-between ${isDisconnected ? 'grayscale opacity-80' : ''}`}>
                    {isDisconnected && (
                        <div className="absolute inset-0 flex items-center justify-center bg-gray-900/80 z-10 backdrop-blur-sm">
                            <span className="text-red-500 font-bold border border-red-500 px-2 py-1 rounded bg-red-900/20 animate-pulse text-xs tracking-wider">MODBUS ERR: {errMsg.toUpperCase()}</span>
                        </div>
                    )}
                    
                    <h3 className="text-lg font-semibold text-indigo-400 mb-2">Feedstock Pump</h3>
                    
                    <div className="mb-4 text-sm">
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-gray-400">Status</span>
                            <span className={`font-bold ${pump?.running ? 'text-green-400' : 'text-red-400'}`}>{pump?.running ? 'RUNNING' : 'STOPPED'}</span>
                        </div>
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-gray-400">Direction</span>
                            <span className="text-gray-200">{pump?.dir === 0 ? 'CW' : 'CCW'}</span>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="text-gray-400">Speed</span>
                            <span className="text-gray-200">{pump?.speed || 0} / 99</span>
                        </div>
                    </div>

                    {/* Mode Switch Tabs */}
                    <div className="flex mb-3 bg-gray-900 rounded p-1">
                        <button 
                            className={`flex-1 py-1 text-sm rounded ${!isAuto ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:text-gray-300'}`}
                            onClick={() => { fetch(`/api/control/pump/manual?state=${pump?.running?'run':'stop'}&dir=${pump?.dir||0}&speed=${pump?.speed||0}`, { method: 'POST' }); }}>Manual</button>
                        <button 
                            className={`flex-1 py-1 text-sm rounded ${isAuto ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:text-gray-300'}`}
                            onClick={() => { fetch(`/api/control/pump/auto?min_w=${pump?.auto_min||0}&max_w=${pump?.auto_max||0}&rec_rpm=${pump?.auto_rec_rpm||0}&dir=${pump?.auto_dir||0}`, { method: 'POST' }); }}>Auto</button>
                    </div>

                    {!isAuto ? (
                        <div className="flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Dir</label>
                                <select className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm"
                                    value={localDir} onChange={(e) => setLocalDir(parseInt(e.target.value))}>
                                    <option value={0}>CW</option>
                                    <option value={1}>CCW</option>
                                </select>
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Speed</label>
                                <input type="number" min="0" max="99" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localSpeed} onChange={(e) => setLocalSpeed(e.target.value)} />
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button className="flex-1 bg-green-600 hover:bg-green-500 py-1 rounded text-sm font-bold" 
                                    onClick={() => fetch(`/api/control/pump/manual?state=run&dir=${localDir}&speed=${localSpeed}`, { method: 'POST' })}>START</button>
                                <button className="flex-1 bg-red-600 hover:bg-red-500 py-1 rounded text-sm font-bold" 
                                    onClick={() => fetch(`/api/control/pump/manual?state=stop&dir=${localDir}&speed=${localSpeed}`, { method: 'POST' })}>STOP</button>
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Min (Kg)</label>
                                <input type="number" step="0.1" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localMin} onChange={(e) => setLocalMin(e.target.value)} />
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Max (Kg)</label>
                                <input type="number" step="0.1" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localMax} onChange={(e) => setLocalMax(e.target.value)} />
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Rec. RPM</label>
                                <input type="number" min="0" max="99" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localSpeed} onChange={(e) => setLocalSpeed(e.target.value)} />
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Dir</label>
                                <select className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localDir} onChange={(e) => setLocalDir(parseInt(e.target.value))}>
                                    <option value={0}>CW</option>
                                    <option value={1}>CCW</option>
                                </select>
                            </div>
                            <button className="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 py-1 rounded text-sm font-bold" 
                                onClick={() => fetch(`/api/control/pump/auto?min_w=${localMin}&max_w=${localMax}&rec_rpm=${localSpeed}&dir=${localDir}`, { method: 'POST' })}>APPLY AUTO</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
